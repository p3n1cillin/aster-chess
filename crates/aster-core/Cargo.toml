[package]
name = "aster-core"
version = "1.0.0"
edition = "2024"
description = "Aster native Rust chess search and neural evaluation core."
license = "GPL-3.0-or-later"
authors = ["The Stockfish developers (original C++ engine)", "Aster contributors (Rust port)"]
rust-version = "1.93.0"

[dependencies]
memmap2 = "0.9.5"

[build-dependencies]
sha2 = "=0.10.9"

[[bin]]
name = "aster-core"
path = "src/main.rs"

[features]
# Exact port of the pinned upstream commit (bench 1,559,611): the fixed baseline
# for strength tests. Aster changes that alter search or evaluation must be
# compiled out under this feature (`#[cfg(not(feature = "upstream-reference"))]`).
upstream-reference = []
evaluation-risk = []
# Bounded Aster search experiment; excluded from production builds.
disagreement-guard = []
# Embed the pinned network (verified by build.rs) so the binary is self-contained.
embed-net = []
# Cycle counters around hot sections (development only).
prof = []
# Windows-only instruction-pointer sampling profiler (development only).
sampler = []
