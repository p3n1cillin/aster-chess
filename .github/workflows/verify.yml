name: Verify
on: [push, pull_request]
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build Aster.sln -c Release
      - run: dotnet run --project tests/Engine.Tests -c Release --no-build
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify.py --setups 1000
      - run: python scripts/tactics.py tests/fixtures/tactics-v1.json --depth 8 --require-solved 32 --output artifacts/tactics/ci.json
