name: Verify Rust
on:
  push:
    paths-ignore: ['artifacts/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['artifacts/**', 'docs/**', '**/*.md']
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p test_match_recovery.py
      - run: python scripts/verify_source_names.py
      - run: python scripts/fetch_rust_network.py
      - run: python scripts/fetch_aster_network.py
      - run: cargo fmt --all --check
      - run: cargo build --workspace --release --locked
      - run: cargo build --release --locked -p aster-engine --features pgo-driver --bin aster-pgo-trainer
      - name: Verify native profile driver
        shell: python {0}
        run: |
          import os, subprocess, sys
          suffix = '.exe' if os.name == 'nt' else ''
          subprocess.run([sys.executable, 'scripts/verify_pgo_driver.py', '--engine', f'target/release/aster{suffix}', '--driver', f'target/release/aster-pgo-trainer{suffix}', '--output', 'artifacts/verification/pgo-driver-ci.json'], check=True)
      - run: cargo test --workspace --release --locked
      - run: cargo test --workspace --locked
      - run: cargo test --release --locked -p aster-core --features disagreement-guard
      - run: cargo test --release --locked -p aster-core --features "evaluation-risk,disagreement-guard"
      - run: python scripts/verify.py --setups 1000
      - run: python scripts/verify_rust_legal_edges.py
      - run: python scripts/smoke_rust_play.py
      - run: python scripts/smoke_mate_proof.py
      - run: python scripts/tactics.py tests/fixtures/tactics-v1.json --engine-arg legacy --depth 8 --require-solved 32 --output artifacts/tactics/legacy-ci.json
      - run: python scripts/tactics.py tests/fixtures/tactics-v1.json --depth 8 --reference-report artifacts/tactics/aster-dev-effdc3-baseline-v1.json --output artifacts/tactics/core-ci.json
      - run: cargo run --release --locked -- bench 7
      - run: python scripts/verify_aster_branding.py --output artifacts/verification/aster-branding-ci.json
      - name: Verify forced AVX2 core signature
        env:
          ASTER_SIMD: avx2
        run: python scripts/verify_aster_branding.py --output artifacts/verification/aster-avx2-ci.json
      - name: Verify scalar core signature
        env:
          ASTER_SIMD: scalar
        run: python scripts/verify_aster_branding.py --output artifacts/verification/aster-scalar-ci.json
