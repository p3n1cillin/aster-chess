name: Verify Rust
on:
  push:
    paths-ignore: ['artifacts/**', 'docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['artifacts/**', 'docs/**', '**/*.md']
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/fetch_rust_network.py
      - run: cargo fmt --all --check
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo test --locked
      - run: python scripts/verify.py --setups 1000
      - run: python scripts/verify_rust_legal_edges.py
      - run: python scripts/smoke_rust_play.py
      - run: python scripts/smoke_mate_proof.py
      - run: python scripts/tactics.py tests/fixtures/tactics-v1.json --depth 8 --require-solved 32 --output artifacts/tactics/rust-ci.json
      - run: cargo run --release --locked -- bench 7
