[package]
name = "aster-engine"
version = "1.0.0"
edition = "2024"
description = "Aster Rust chess engine with native search visualization and verifiable mating strategies."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["chess", "treesearch"]
categories = ["games"]
repository = "https://github.com/p3n1cillin/aster-chess"
authors = ["Cosmo Bobak (Viridithas upstream)", "Aster contributors"]
rust-version = "1.93.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
disagreement-guard = ["aster-core/disagreement-guard"]

tuning = []
stats = ["dep:linkme", "dep:histogram"]
nnz-counts = []
datagen = [
    "dep:toml",
    "dep:rand",
    "dep:num_cpus",
    "dep:chrono",
    "dep:ctrlc",
    "dep:bulletformat",
]

ft-record = []

[dependencies]
# datagen dependencies
rand = { version = "0.9.2", optional = true }

toml = { version = "0.9.7", optional = true }
num_cpus = { version = "1.16.0", optional = true }
chrono = { version = "0.4.35", optional = true }
ctrlc = { version = "3.4.4", optional = true }
bulletformat = { version = "1.2.0", optional = true }

# stats dependencies
linkme = { version = "0.3", optional = true }
histogram = { version = "1.3", optional = true }

# Default native Rust playing core (GPL-3.0-or-later); provenance in its UPSTREAM.json.
aster-core = { path = "../aster-core", features = ["embed-net"] }

# general dependencies
clap = { version = "4.5.3", features = ["derive"] }
arrayvec = "0.7.4"
anyhow = "1.0.86"
thiserror = "2.0.17"
ruzstd = "0.8.1"

# for sharing network weights between processes
memmap2 = "0.9.5"

# for deconflicting shared weights
fxhash = "0.2.1"

# what it says on the tin
term_size = "0.3.2"
vec1 = "1.12.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tiny_http = "0.12"

[build-dependencies]
sha2 = "=0.10.9"

# for coloured terminal output
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
]

[[bin]]
name = "aster"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("syzygy", "bindgen", "zstd", "final-release"))'] }
